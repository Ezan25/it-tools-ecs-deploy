name: app-image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: it-tools-ecs

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::071975552065:role/it-tools-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push
        working-directory: app
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$SHA" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "Pushed image tag $SHA" >> "$GITHUB_STEP_SUMMARY"